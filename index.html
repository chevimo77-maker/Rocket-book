<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834}}">
class Component extends DCLogic {
  state = { taps: 0, busy: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const taps = (this.state && this.state.taps) || 0;
    const busy = !!(this.state && this.state.busy);
    const cls = 'scene' + (taps === 0 ? '' : (taps % 2 ? ' ta' : ' tb')) + (busy ? ' busy' : ' ready');
    return {
      cls: cls,
      hint: busy ? 'Mira...' : '¡Toca el cohete!',
      pillCls: busy ? 'pill wait' : 'pill go',
      tap: () => {
        if (this.state && this.state.busy) return;
        this.setState({ taps: taps + 1, busy: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ busy: false }), 1700);
      }
    };
  }
}
</script>
