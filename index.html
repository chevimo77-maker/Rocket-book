<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rumbo a la Luna">
<link rel="manifest" href="manifest.webmanifest">
<title>¡Rumbo a la Luna! Libro interactivo</title>
<style>
  html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#0b1030}
  /* The book lives in this frame, so going fullscreen here survives page turns
     (a normal page navigation would drop the browser out of fullscreen). */
  #book{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
  #fs{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
      width:44px;height:44px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;
      background:rgba(11,16,48,.55);color:#fff;opacity:.75;transition:opacity .2s,background .2s;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #fs:hover,#fs:focus-visible{opacity:1;background:rgba(11,16,48,.8)}
  #fs:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
  #fs svg{width:22px;height:22px}
  #fs .exit,.is-fs #fs .enter{display:none}
  .is-fs #fs .exit{display:block}
  .is-fs #fs{opacity:.35}
  [hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="book" title="¡Rumbo a la Luna! Libro interactivo" allow="fullscreen" allowfullscreen></iframe>
<button id="fs" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>
<script>
(function () {
  'use strict';
  var frame = document.getElementById('book'), btn = document.getElementById('fs'), de = document.documentElement;
  var PAGE = /^p\d\d-[a-z0-9-]+\.html$/;

  // Start on the page in the hash (#p07-countdown.html), else the cover.
  var start = decodeURIComponent(location.hash.slice(1));
  frame.src = PAGE.test(start) ? start : 'p01-cover.html';

  // Keep the address bar and title in sync with the page being read.
  frame.addEventListener('load', function () {
    try {
      var w = frame.contentWindow, page = w.location.pathname.split('/').pop();
      if (PAGE.test(page)) history.replaceState(null, '', '#' + page);
      document.title = w.document.title || document.title;
      w.focus(); // so arrow keys reach the page
    } catch (e) {}
  });

  // Arrow keys pressed while the shell (e.g. the button) has focus still turn pages.
  document.addEventListener('keydown', function (e) {
    var b = frame.contentWindow && frame.contentWindow.__book;
    if (!b) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') b.next();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') b.prev();
  });

  var req = de.requestFullscreen || de.webkitRequestFullscreen;
  var exit = document.exitFullscreen || document.webkitExitFullscreen;
  function current() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function sync() {
    var on = !!current();
    de.classList.toggle('is-fs', on);
    btn.setAttribute('aria-label', on ? 'Salir de pantalla completa' : 'Pantalla completa');
    btn.title = btn.getAttribute('aria-label');
  }
  // iPhone Safari has no fullscreen API: hide the button there (Add to Home Screen opens it fullscreen instead).
  if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
    btn.hidden = false;
    btn.addEventListener('click', function () {
      if (current()) exit.call(document);
      else {
        var p = req.call(de, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(function () {});
      }
      try { frame.contentWindow.focus(); } catch (e) {}
    });
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }
})();
</script>
</body>
</html>
