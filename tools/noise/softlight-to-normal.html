<!doctype html><html><body style="margin:0;background:transparent;overflow:hidden"><canvas id="c" style="display:block"></canvas>
<script>
// Turns a grayscale noise texture meant for mix-blend-mode:soft-light into an equivalent
// texture for normal blending (white where it lightened, black where it darkened), so the
// overlay no longer needs an expensive blend pass every frame.
var q = new URLSearchParams(location.search), K = 0.45, img = new Image();
img.onload = function () {
  var c = document.getElementById('c'), x = c.getContext('2d');
  c.width = img.width; c.height = img.height; x.drawImage(img, 0, 0);
  var d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (var i = 0; i < p.length; i += 4) {
    var v = p[i] / 255, a = p[i + 3] / 255, w = v > 0.5 ? 255 : 0;
    p[i] = p[i + 1] = p[i + 2] = w;
    p[i + 3] = Math.round(255 * Math.min(1, a * K * Math.abs(2 * v - 1)));
  }
  x.putImageData(d, 0, 0);
};
img.src = q.get('src');
</script></body></html>
