  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lines = [
      'Allá arriba, la parte de abajo del cohete ya terminó su trabajo.',
      '¡Crac! El cohete se separa en dos. La parte de arriba sigue hacia el espacio.',
      'La parte de abajo, el propulsor, da la vuelta para volver a casa.',
      'Saca las patas y... ¡plop! Aterriza en un barco en el mar, listo para volar otra vez.'
    ];
    const durs = [3100, 3900, 1800, 3900];
    const step = (this.state && this.state.step) || 0;
    const busy = !!(this.state && this.state.busy);
    const max = lines.length - 1;
    let cls = 'scene' + (busy ? ' busy' : ' ready');
    for (let i = 1; i <= step; i++) cls += ' s' + i;
    return {
      cls: cls,
      caption: lines[step],
      hint: busy ? 'Mira...' : (step < max ? '¡Toca el cohete!' : '¡Toca para repetir!'),
      pillCls: busy ? 'pill wait' : 'pill go',
      tap: () => {
        if (this.state && this.state.busy) return;
        const n = step >= max ? 0 : step + 1;
        this.setState({ step: n, busy: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ busy: false }), durs[n]);
      }
    };
  }
}
</script>
