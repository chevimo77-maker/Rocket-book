<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834}}">
class Component extends DCLogic {
  state = { step: 0, busy: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lines = [
      '¡A subirse! Ana y Leo entran al ascensor.',
      'Sube, sube, sube por la torre. ¡Tilín!',
      'Cruzan el puente y entran a la cápsula.',
      'Escotilla cerrada. Cinturones puestos. ¡Clic! ¿Les dices adiós con la mano?'
    ];
    const durs = [3100, 4400, 2200, 1200];
    const step = (this.state && this.state.step) || 0;
    const busy = !!(this.state && this.state.busy);
    const max = lines.length - 1;
    let cls = 'scene' + (busy ? ' busy' : ' ready');
    for (let i = 1; i <= step; i++) cls += ' s' + i;
    return {
      cls: cls,
      caption: lines[step],
      hint: busy ? 'Mira...' : (step < max ? '¡Toca el ascensor!' : '¡Toca para repetir!'),
      pillCls: busy ? 'pill wait' : 'pill go',
      tap: () => {
        if (this.state && this.state.busy) return;
        const n = step >= max ? 0 : step + 1;
        this.setState({ step: n, busy: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ busy: false }), durs[n]);
      }
    };
  }
}
</script>
