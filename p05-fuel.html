.frost{opacity:0;transform-box:fill-box;transform-origin:center}

.ice{opacity:0;transition:opacity 1.5s ease 1.6s}

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834}}">
class Component extends DCLogic {
  state = { step: 0, busy: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lines = [
      'Los cohetes necesitan MUCHO combustible para volar. ¡A llenarlo!',
      'Este combustible es súper, súper frío. ¡Brrr! Mira las nubecitas de escarcha.',
      'Este otro es un aceite especial llamado queroseno. ¡Glu, glu!',
      '¡Lleno! El cohete está listo para volar.'
    ];
    const durs = [2800, 2900, 2900, 900];
    const step = (this.state && this.state.step) || 0;
    const busy = !!(this.state && this.state.busy);
    const max = lines.length - 1;
    let cls = 'scene' + (busy ? ' busy' : ' ready');
    for (let i = 1; i <= step; i++) cls += ' s' + i;
    return {
      cls: cls,
      caption: lines[step],
      hint: busy ? 'Mira...' : (step < max ? '¡Toca para llenar!' : '¡Toca para repetir!'),
      pillCls: busy ? 'pill wait' : 'pill go',
      tap: () => {
        if (this.state && this.state.busy) return;
        const n = step >= max ? 0 : step + 1;
        this.setState({ step: n, busy: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ busy: false }), durs[n]);
      }
    };
  }
}
</script>
