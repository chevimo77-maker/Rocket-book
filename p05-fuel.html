body{margin:0}

.tw{animation:tw 2.6s ease-in-out infinite}

.busy .hint{opacity:0;animation:none}
.pill{transition:opacity .3s}
.pill.wait{opacity:.55}
.pill.go{animation:nudge 1.4s ease-in-out infinite}
.lv{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 2.4s ease-in-out .4s}
.s1 .lvB{transform:scaleY(1)}
.s2 .lvO{transform:scaleY(1)}
.flow{opacity:0;stroke-dasharray:14 22}
.s1 .flowB{opacity:1;animation:flow .6s linear infinite}
.s2 .flowO{opacity:1;animation:flow .6s linear infinite}
.s3 .flow{opacity:0}
.frost{opacity:0;transform-box:fill-box;transform-origin:center}
.s1 .frost{animation:puff 3.2s ease-in-out infinite}
.ice{opacity:0;transition:opacity 1.5s ease 1.6s}
.s1 .ice{opacity:1}
.spk{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s cubic-bezier(.34,1.8,.5,1),opacity .3s ease}
.s3 .spk{opacity:1;transform:scale(1)}
.tankB{transform-box:fill-box;transform-origin:50% 100%}
.s1 .tankB{animation:wob 1s ease-in-out 2}
.tankO{transform-box:fill-box;transform-origin:50% 100%}
.s2 .tankO{animation:wob 1s ease-in-out 2}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes puff{0%{opacity:0;transform:scale(.5) translateX(0)}30%{opacity:.95}100%{opacity:0;transform:scale(1.4) translateX(40px)}}

@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:.35}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:834}}">
class Component extends DCLogic {
  state = { step: 0, busy: false };
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lines = [
      'Los cohetes necesitan MUCHO combustible para volar. ¡A llenarlo!',
      'Este combustible es súper, súper frío. ¡Brrr! Mira las nubecitas de escarcha.',
      'Este otro es un aceite especial llamado queroseno. ¡Glu, glu!',
      '¡Lleno! El cohete está listo para volar.'
    ];
    const durs = [2800, 2900, 2900, 900];
    const step = (this.state && this.state.step) || 0;
    const busy = !!(this.state && this.state.busy);
    const max = lines.length - 1;
    let cls = 'scene' + (busy ? ' busy' : ' ready');
    for (let i = 1; i <= step; i++) cls += ' s' + i;
    return {
      cls: cls,
      caption: lines[step],
      hint: busy ? 'Mira...' : (step < max ? '¡Toca para llenar!' : '¡Toca para repetir!'),
      pillCls: busy ? 'pill wait' : 'pill go',
      tap: () => {
        if (this.state && this.state.busy) return;
        const n = step >= max ? 0 : step + 1;
        this.setState({ step: n, busy: true });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ busy: false }), durs[n]);
      }
    };
  }
}
</script>
